name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Catch a stale vendorHash in zoekt.nix and other image breakage before it
  # reaches main. Pull requests only build; they don't publish.
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '*.nix'
      - 'flake.lock'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  # Nix builds the image for the system it runs on, so each architecture builds
  # natively on its own runner instead of under QEMU.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: build
        run: nix build .#docker-image --out-link zoekt.tar

      - name: smoke test
        run: |
          docker load <zoekt.tar
          docker run --rm zoekt:latest sh -c 'zoekt-webserver -version && universal-ctags --version && git --version'

      - name: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: zoekt.tar
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: version
        id: version
        run: .github/workflows/docker-version.sh

      - name: docker-meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: images

      # Combine the per-architecture images into one multi-arch manifest and
      # push it under each tag.
      - name: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
          podman manifest create zoekt
          for image in images/image-*/zoekt.tar; do
            podman manifest add zoekt "docker-archive:$image"
          done
          podman manifest inspect zoekt
          while read -r tag; do
            podman manifest push --all zoekt "docker://$tag"
          done <<<"$TAGS"
